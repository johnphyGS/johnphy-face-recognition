<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Johnphy AI - Face Recognition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#05070b;
    --panel:rgba(7,11,17,.86);
    --line:rgba(255,255,255,.09);
    --text:#eef3f8;
    --muted:#71809a;
    --cyan:#28e0ff;
    --mint:#3dffb0;
    --coral:#ff4d68;
    --amber:#ffb347;

    --font-display:'Space Grotesk',Arial,sans-serif;
    --font-body:'Inter',Arial,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
}

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#020306;
    transform:scaleX(-1);
    filter:saturate(1.05) contrast(1.03);
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    transform:scaleX(-1);
}

/* ambient vignette + subtle scanline texture */
body:after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.018) 0px,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 3px
        ),
        linear-gradient(
            to bottom,
            rgba(2,4,8,.86),
            transparent 26%,
            transparent 60%,
            rgba(2,4,8,.92)
        ),
        radial-gradient(
            circle at 50% 38%,
            transparent 0,
            rgba(0,0,0,.16) 55%,
            rgba(0,0,0,.6) 100%
        );
}

/* TOP */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px 18px 0;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:40px;
    height:40px;
    flex:0 0 40px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:linear-gradient(160deg,#0d1620,#161f2c);
    border:1px solid rgba(40,224,255,.35);
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 8px 22px rgba(40,224,255,.14);

    font-family:var(--font-mono);
    font-size:17px;
    font-weight:700;
    color:var(--cyan);
}

.brand h1{
    margin:0;
    font-family:var(--font-display);
    font-size:16px;
    font-weight:700;
    letter-spacing:.2px;
}

.brand small{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.6px;
    text-transform:uppercase;
}

.live{
    display:flex;
    align-items:center;
    gap:8px;

    padding:7px 12px;

    border:1px solid var(--line);
    border-radius:8px;

    background:rgba(4,7,12,.5);
    backdrop-filter:blur(12px);

    font-family:var(--font-mono);
    font-size:11px;
    font-weight:500;
    letter-spacing:1px;
    color:var(--muted);
}

.dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#4a5568;
}

.live.on{
    color:var(--cyan);
    border-color:rgba(40,224,255,.3);
}

.live.on .dot{
    background:var(--cyan);
    box-shadow:0 0 10px var(--cyan);
    animation:blink 1.4s ease-in-out infinite;
}

@keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:.35; }
}

.clock{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--muted);
    margin-top:8px;
    text-align:right;
    letter-spacing:.5px;
}

/* SCAN FRAME */

.scan-area{
    position:fixed;
    z-index:10;

    left:50%;
    top:42%;

    width:min(76vw,320px);

    aspect-ratio:3/4;

    transform:translate(-50%,-50%);

    pointer-events:none;
}

.scan-area .frame-grid{
    position:absolute;
    inset:0;
    border-radius:16px;
    opacity:0;
    transition:opacity .4s ease;
    background:
        linear-gradient(rgba(40,224,255,.16) 1px,transparent 1px) 0 0/100% 25%,
        linear-gradient(90deg,rgba(40,224,255,.16) 1px,transparent 1px) 0 0/25% 100%;
}

.scanning .frame-grid{
    opacity:.55;
}

.scan-area .radar{
    position:absolute;
    inset:0;
    border-radius:50%;
    opacity:0;
    transition:opacity .4s ease;
}

.scanning .radar{
    opacity:.9;
    animation:spin 2.6s linear infinite;
    background:conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(40,224,255,.5) 26deg,
        transparent 60deg
    );
    -webkit-mask:radial-gradient(circle, transparent 0%, transparent 0%, black 1%, black 100%);
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

.corner{
    position:absolute;

    width:30px;
    height:30px;

    border-color:var(--cyan);
    border-style:solid;

    transition:border-color .25s ease, filter .25s ease;
    filter:drop-shadow(0 0 4px rgba(40,224,255,.5));
}

.corner.tl{ top:0; left:0; border-width:2.5px 0 0 2.5px; border-radius:8px 0 0 0; }
.corner.tr{ top:0; right:0; border-width:2.5px 2.5px 0 0; border-radius:0 8px 0 0; }
.corner.bl{ left:0; bottom:0; border-width:0 0 2.5px 2.5px; border-radius:0 0 0 8px; }
.corner.br{ right:0; bottom:0; border-width:0 2.5px 2.5px 0; border-radius:0 0 8px 0; }

.locked .corner{
    border-color:var(--mint);
    filter:drop-shadow(0 0 7px rgba(61,255,176,.7));
    animation:lock-pulse .9s ease-out;
}

.alert .corner{
    border-color:var(--coral);
    filter:drop-shadow(0 0 7px rgba(255,77,104,.7));
}

@keyframes lock-pulse{
    0%{ transform:scale(1.14); }
    100%{ transform:scale(1); }
}

.reticle-label{
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%);

    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--cyan);
    text-transform:uppercase;
    opacity:0;
    transition:opacity .3s ease, color .25s ease;
    white-space:nowrap;
}

.scanning .reticle-label{ opacity:.85; }
.locked .reticle-label{ color:var(--mint); opacity:1; }
.alert .reticle-label{ color:var(--coral); opacity:1; }

/* BOTTOM PANEL */

.panel{
    position:fixed;

    left:14px;
    right:14px;
    bottom:14px;

    z-index:25;

    padding:16px;

    border:1px solid var(--line);
    border-radius:20px;

    background:var(--panel);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:0 20px 55px rgba(0,0,0,.45);
}

.result{
    display:flex;
    align-items:center;
    gap:13px;

    min-height:52px;
}

.result-icon{
    width:46px;
    height:46px;
    flex:0 0 46px;

    display:grid;
    place-items:center;

    border-radius:12px;

    background:rgba(255,255,255,.06);
    border:1px solid var(--line);

    font-family:var(--font-mono);
    font-size:20px;
    transition:all .25s ease;
}

.result-title{
    margin:0;
    font-family:var(--font-display);
    font-size:18px;
    font-weight:700;
    letter-spacing:.2px;
}

.result-sub{
    margin:3px 0 0;
    color:var(--muted);
    font-size:12px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:13px;
}

.stat{
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(255,255,255,.03);
}

.stat-label{
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1.2px;
}

.stat-value{
    margin-top:4px;
    font-family:var(--font-mono);
    font-size:14px;
    font-weight:700;
}

.people-message{
    margin-top:9px;
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.3px;
    color:#a9b7c9;
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:13px;
}

button{
    border:0;
    min-height:44px;
    border-radius:12px;
    color:white;
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
}

button:active{
    transform:scale(.97);
}

#start{
    background:linear-gradient(135deg,#1fb8de,#28e0ff);
    color:#02141a;
    font-weight:700;
    box-shadow:0 10px 24px rgba(40,224,255,.22);
}

#flip{
    background:rgba(255,255,255,.07);
    border:1px solid var(--line);
}

.hint{
    margin:11px 2px 0;
    color:#5c6a80;
    text-align:center;
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:.6px;
    text-transform:uppercase;
}

.known .result-icon{
    background:rgba(61,255,176,.12);
    border-color:rgba(61,255,176,.3);
    color:var(--mint);
}
.known .result-title{ color:var(--mint); }

.unknown .result-icon{
    background:rgba(255,77,104,.12);
    border-color:rgba(255,77,104,.3);
    color:var(--coral);
}
.unknown .result-title{ color:var(--coral); }

@media(min-width:700px){
    .panel{
        max-width:460px;
        left:50%;
        right:auto;
        width:460px;
        transform:translateX(-50%);
    }
    .scan-area{ width:340px; }
}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<canvas id="canvas"></canvas>

<div class="topbar">

    <div class="brand">
        <div class="logo">J</div>
        <div>
            <h1>Johnphy AI</h1>
            <small>Biometric Scanner</small>
        </div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:flex-end;">
        <div class="live" id="live">
            <span class="dot"></span>
            <span id="liveText">OFFLINE</span>
        </div>
        <div class="clock" id="clock"></div>
    </div>

</div>

<div class="scan-area" id="scanArea">
    <div class="frame-grid"></div>
    <div class="radar"></div>
    <div class="reticle-label" id="reticleLabel">Scanning</div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
</div>

<div class="panel" id="panel">

    <div class="result">
        <div class="result-icon" id="resultIcon">◉</div>
        <div>
            <p class="result-title" id="resultTitle">System Ready</p>
            <p class="result-sub" id="resultSub">Loading face recognition...</p>
        </div>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-label">People</div>
            <div class="stat-value" id="faceCount">0 detected</div>
        </div>
        <div class="stat">
            <div class="stat-label">Unknown</div>
            <div class="stat-value" id="unknownCount">0 unknown</div>
        </div>
    </div>

    <div class="people-message" id="peopleMessage">There are 0 unknown people</div>

    <div class="buttons">
        <button id="start">Start Camera</button>
        <button id="flip">Flip Camera</button>
    </div>

    <div class="hint">Johnphy → green &nbsp;•&nbsp; Others → red / unknown</div>

</div>


<!-- FACE API -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>


<script>

/* =====================================
   SETTINGS
===================================== */

const MATCH_THRESHOLD = 0.52;

const MODEL_URL =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model";


/*
   IMPORTANT:
   These are the five photos of Johnphy.
   All five must be uploaded to GitHub
   in the same folder as index.html.
*/

const REFERENCE_IMAGES = [
    "johnphy1.jpg",
    "johnphy2.jpg",
    "johnphy3.jpg",
    "johnphy4.jpg",
    "johnphy5.jpg"
];


/* =====================================
   ELEMENTS
===================================== */

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const startButton = document.getElementById("start");
const flipButton = document.getElementById("flip");
const resultTitle = document.getElementById("resultTitle");
const resultSub = document.getElementById("resultSub");
const resultIcon = document.getElementById("resultIcon");
const faceCount = document.getElementById("faceCount");
const unknownCount = document.getElementById("unknownCount");
const peopleMessage = document.getElementById("peopleMessage");
const panel = document.getElementById("panel");
const scanArea = document.getElementById("scanArea");
const reticleLabel = document.getElementById("reticleLabel");
const live = document.getElementById("live");
const liveText = document.getElementById("liveText");
const clock = document.getElementById("clock");


/* =====================================
   VARIABLES
===================================== */

let referenceFaces = [];
let stream = null;
let cameraRunning = false;
let facingMode = "user";
let scanning = false;
let lastScanTime = 0;

/*
   Stability system.
   This prevents the app from changing
   between Johnphy and Unknown because
   of one bad frame.
*/
let lastLabels = new Map();


/* =====================================
   CLOCK (HUD readout)
===================================== */

function tickClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,"0");
    const mm = String(now.getMinutes()).padStart(2,"0");
    const ss = String(now.getSeconds()).padStart(2,"0");
    clock.textContent = `${hh}:${mm}:${ss}`;
}
tickClock();
setInterval(tickClock, 1000);


/* =====================================
   RESULT UI
===================================== */

function setResult(type, title, sub, icon){

    panel.classList.remove("known","unknown");
    scanArea.classList.remove("locked","alert");

    if(type === "known"){
        panel.classList.add("known");
        scanArea.classList.add("locked");
        reticleLabel.textContent = "Johnphy — Match";
    }

    if(type === "unknown"){
        panel.classList.add("unknown");
        scanArea.classList.add("alert");
        reticleLabel.textContent = "Unidentified";
    }

    if(type === "normal"){
        reticleLabel.textContent = "Scanning";
    }

    resultTitle.textContent = title;
    resultSub.textContent = sub;
    resultIcon.textContent = icon;
}


/* =====================================
   LIVE INDICATOR
===================================== */

function setLive(on){
    live.classList.toggle("on", on);
    liveText.textContent = on ? "LIVE" : "OFFLINE";
}


/* =====================================
   LOAD MODELS
===================================== */

async function loadModels(){

    setResult("normal","Loading AI","Preparing face recognition models...","◌");

    await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);

}


/* =====================================
   LOAD ALL 5 JOHNPHY PHOTOS
===================================== */

async function loadReferenceFaces(){

    referenceFaces = [];

    for(const filename of REFERENCE_IMAGES){

        try{

            const image = await faceapi.fetchImage(filename);

            const result = await faceapi
                .detectSingleFace(image, new faceapi.TinyFaceDetectorOptions({
                    inputSize:224,
                    scoreThreshold:0.5
                }))
                .withFaceLandmarks()
                .withFaceDescriptor();

            if(result){
                referenceFaces.push(result.descriptor);
                console.log("Loaded:", filename);
            }
            else{
                console.warn("No face found:", filename);
            }

        }
        catch(error){
            console.warn("Could not load:", filename);
        }

    }

    if(referenceFaces.length === 0){
        throw new Error("No reference photos could be loaded.");
    }

    setResult("normal","System Ready", `${referenceFaces.length} Johnphy reference photos loaded`, "✓");

}


/* =====================================
   CAMERA
===================================== */

async function openCamera(){

    if(stream){
        stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
        video:{
            facingMode:{ ideal:facingMode },
            width:{ ideal:1280 },
            height:{ ideal:720 },
            frameRate:{ ideal:30 }
        },
        audio:false
    });

    video.srcObject = stream;
    await video.play();

    cameraRunning = true;
    setLive(true);
    scanArea.classList.add("scanning");
    startButton.textContent = "Stop Camera";

    scanFaces();

}


/* =====================================
   START / STOP
===================================== */

async function startOrStop(){

    if(cameraRunning){
        stopCamera();
        return;
    }

    try{
        await openCamera();
    }
    catch(error){
        console.error(error);
        setLive(false);
        setResult("unknown","Camera unavailable","Allow camera permission and try again","!");
    }

}


function stopCamera(){

    cameraRunning = false;
    scanning = false;

    if(stream){
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    video.srcObject = null;

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);

    startButton.textContent = "Start Camera";

    setLive(false);
    scanArea.classList.remove("scanning","locked","alert");

    faceCount.textContent = "0 detected";
    unknownCount.textContent = "0 unknown";
    peopleMessage.textContent = "There are 0 unknown people";

    setResult("normal","System Ready","Press Start Camera to begin","◉");

}


/* =====================================
   FLIP CAMERA
===================================== */

async function flipCamera(){

    if(!cameraRunning){ return; }

    facingMode = facingMode === "user" ? "environment" : "user";

    try{
        await openCamera();
    }
    catch(error){
        console.error(error);
    }

}


/* =====================================
   FIND CLOSEST REFERENCE
===================================== */

function getBestMatch(descriptor){

    let bestDistance = Infinity;

    for(const reference of referenceFaces){
        const distance = faceapi.euclideanDistance(reference, descriptor);
        if(distance < bestDistance){
            bestDistance = distance;
        }
    }

    return bestDistance;

}


/* =====================================
   DRAW FACE (HUD targeting brackets)
===================================== */

function drawFace(ctx, box, name, known, distance){

    const color = known ? "#3dffb0" : "#ff4d68";
    const glow = known ? "rgba(61,255,176,.55)" : "rgba(255,77,104,.55)";

    const armLen = Math.max(16, box.width * 0.16);

    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.shadowColor = glow;
    ctx.shadowBlur = 10;
    ctx.lineCap = "round";

    const x = box.x, y = box.y, w = box.width, h = box.height;

    /* four corner brackets instead of a plain rectangle */
    const corners = [
        [[x, y+armLen],[x, y],[x+armLen, y]],
        [[x+w-armLen, y],[x+w, y],[x+w, y+armLen]],
        [[x, y+h-armLen],[x, y+h],[x+armLen, y+h]],
        [[x+w-armLen, y+h],[x+w, y+h],[x+w, y+h-armLen]]
    ];

    corners.forEach(pts => {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        ctx.lineTo(pts[1][0], pts[1][1]);
        ctx.lineTo(pts[2][0], pts[2][1]);
        ctx.stroke();
    });

    ctx.shadowBlur = 0;

    /* label pill */
    ctx.font = "600 15px 'JetBrains Mono', monospace";
    const label = known ? `${name}` : `${name}`;
    const confidence = ` ${Math.max(0, Math.round((1 - distance) * 100))}%`;
    const fullLabel = label + confidence;
    const textWidth = ctx.measureText(fullLabel).width;
    const padding = 9;
    const labelHeight = 26;
    const labelY = Math.max(labelHeight + 4, y - 6);

    ctx.fillStyle = color;
    ctx.fillRect(x, labelY - labelHeight, textWidth + padding * 2, labelHeight);

    ctx.fillStyle = "#040807";
    ctx.fillText(fullLabel, x + padding, labelY - 8);

    ctx.restore();

}


/* =====================================
   FACE SCANNING
===================================== */

async function scanFaces(){

    if(!cameraRunning || scanning){
        if(cameraRunning){ requestAnimationFrame(scanFaces); }
        return;
    }

    const now = performance.now();

    /* Don't scan every single frame — saves phone battery/CPU. */
    if(now - lastScanTime < 180){
        requestAnimationFrame(scanFaces);
        return;
    }

    lastScanTime = now;
    scanning = true;

    try{

        if(video.readyState < 2 || video.videoWidth === 0){
            return;
        }

        const width = video.videoWidth;
        const height = video.videoHeight;

        canvas.width = width;
        canvas.height = height;

        const detections = await faceapi
            .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({
                inputSize:224,
                scoreThreshold:0.5
            }))
            .withFaceLandmarks()
            .withFaceDescriptors();

        const results = faceapi.resizeResults(detections, { width, height });

        const ctx = canvas.getContext("2d");
        ctx.clearRect(0,0,width,height);

        const totalPeople = results.length;
        let johnphyFound = false;
        let unknownPeople = 0;

        /* Process every detected face. */
        results.forEach((face, index) => {

            const distance = getBestMatch(face.descriptor);
            const recognized = distance <= MATCH_THRESHOLD;

            /* Stability: require a little consistency before changing the label. */
            const key = `${Math.round(face.detection.box.x / 50)}_${Math.round(face.detection.box.y / 50)}`;

            if(!lastLabels.has(key)){
                lastLabels.set(key, {
                    label: recognized ? "Johnphy" : "Unknown",
                    stableFrames:1
                });
            }
            else{

                const previous = lastLabels.get(key);
                const currentLabel = recognized ? "Johnphy" : "Unknown";

                if(previous.label === currentLabel){
                    previous.stableFrames++;
                }
                else{
                    previous.stableFrames--;
                    if(previous.stableFrames <= 0){
                        previous.label = currentLabel;
                        previous.stableFrames = 2;
                    }
                }

            }

            const tracked = lastLabels.get(key);
            const isJohnphy = tracked.label === "Johnphy";

            if(isJohnphy){ johnphyFound = true; }
            else{ unknownPeople++; }

            drawFace(ctx, face.detection.box, isJohnphy ? "Johnphy" : "Unknown", isJohnphy, distance);

        });

        /* Remove old tracking entries. */
        if(lastLabels.size > 20){
            lastLabels = new Map(Array.from(lastLabels).slice(-10));
        }

        /* COUNTERS */
        faceCount.textContent = `${totalPeople} detected`;
        unknownCount.textContent = `${unknownPeople} unknown`;
        peopleMessage.textContent = `There are ${unknownPeople} unknown ${unknownPeople === 1 ? "person" : "people"}`;

        /* MAIN RESULT */
        if(totalPeople === 0){
            setResult("normal","No Face Detected","Position your face inside the frame","⌾");
        }
        else if(johnphyFound){
            setResult("known","Johnphy",
                unknownPeople > 0
                ? `${unknownPeople} unknown ${unknownPeople === 1 ? "person" : "people"} detected`
                : "Face matched successfully",
                "✓");
        }
        else{
            setResult("unknown","Unknown",
                `${unknownPeople} ${unknownPeople === 1 ? "person" : "people"} detected`,
                "!");
        }

    }
    catch(error){
        console.error(error);
    }
    finally{
        scanning = false;
        if(cameraRunning){ requestAnimationFrame(scanFaces); }
    }

}

startButton.addEventListener("click", startOrStop);
flipButton.addEventListener("click", flipCamera);

        await loadReferenceFaces();

    }
